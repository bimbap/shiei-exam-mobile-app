name: Build iOS Release (.ipa)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag label for artifact naming (e.g. v2.6.0)'
        required: false
        default: 'v2.6.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          TAG_NAME="${{ github.event.inputs.version_tag || github.ref_name }}"
          if [ "$TAG_NAME" = "main" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="v2.6.0"
          fi
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r -y "ShieiExam-iOS-${TAG_NAME}-unsigned.ipa" Payload
          echo "IPA_PATH=build/ipa/ShieiExam-iOS-${TAG_NAME}-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieiExam-iOS-IPA
          path: ${{ env.IPA_PATH }}

      - name: Attach IPA to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_PATH }}
